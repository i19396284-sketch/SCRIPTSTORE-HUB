<!DOCTYPE html><html><head><meta charset="utf-8"><title>ScriptStore Hub PRO</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}body{background:#04020a;color:#fff;padding:20px;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow-x:hidden;position:relative;transition:background 0.5s;}.bg-obj{position:absolute;border-radius:50%;pointer-events:none;z-index:1;}.f-star{background:#fff;animation:stF linear infinite,stB 1.5s infinite ease-in-out;}.f-meteor{background:linear-gradient(135deg,#ff4500 0%,#ff8c00 50%,rgba(0,0,0,0) 100%);transform:rotate(-35deg);border-radius:0;animation:mtF linear infinite;}.r-bubble{animation:bbF linear infinite;}@keyframes stF{0%{transform:translateY(-20px) translateX(0);}100%{transform:translateY(105vh) translateX(40px);}}@keyframes stB{0%,100%{opacity:0.3;}50%{opacity:1;}}@keyframes mtF{0%{transform:translateY(-100px) translateX(0) rotate(-35deg);opacity:1;}100%{transform:translateY(105vh) translateX(-250px) rotate(-35deg);opacity:0;}}@keyframes bbF{0%{transform:translateY(105vh) scale(0.5);opacity:0;}20%{opacity:0.7;}90%{opacity:0.7;}100%{transform:translateY(-100px) scale(1.3);opacity:0;}}@keyframes rbBg{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}.f{width:550px;background:rgba(21,24,33,0.95);border:2px solid #45f3ff;border-radius:12px;padding:25px;box-shadow:0 0 25px rgba(69,243,255,0.3);position:relative;z-index:10;transition:all 0.5s;}.c{background:#1f2833;border:1px solid #45f3ff;padding:15px;margin-top:12px;border-radius:8px;transition:all 0.5s;}.p{border-color:#d4af37;}.b{padding:8px 16px;background:#45f3ff;color:#0b0c10;border:none;border-radius:5px;font-weight:bold;cursor:pointer;margin-top:10px;width:100%;font-size:12px;transition:all 0.2s;}.b:hover{opacity:0.9;}.bg{background:#d4af37;}.t-bar{display:flex;justify-content:center;gap:8px;margin-bottom:15px;}.t-btn{padding:5px 12px;border:none;border-radius:4px;font-weight:bold;font-size:10px;cursor:pointer;color:#fff;}input,textarea{width:100%;padding:8px;margin-top:8px;background:#0b0c10;border:1px solid #2d3748;color:#fff;font-size:12px;border-radius:4px;}#o{max-height:150px;overflow-y:auto;margin-top:5px;}.o{background:#0b0c10;padding:8px;border-radius:5px;margin-top:8px;font-size:12px;border-left:3px solid #45f3ff;color:#fff;}</style></head><body>
<div class="f" id="mainBox">
  <h2 style="text-align:center;font-size:18px;margin-bottom:12px;" id="title">☄️ SCRIPTSTORE HUB</h2>
  <div class="t-bar">
    <button class="t-btn" style="background:#ff4500;box-shadow:0 0 5px #ff4500;" onclick="setTheme('meteor')">☄️ МЕТЕОРИТ</button>
    <button class="t-btn" style="background:#6a0dad;box-shadow:0 0 5px #6a0dad;" onclick="setTheme('space')">🌌 КОСМОС</button>
    <button class="t-btn" style="background:linear-gradient(45deg,red,orange,yellow,green,blue,violet);" onclick="setTheme('rainbow')">🌈 РАДУГА</button>
  </div>
  <div class="c" id="b1"><h3>Xeno Ink (FREE)</h3><p style="font-size:11px;color:#8b9bb4;margin-top:4px;">Защита от AFK-кика.</p><button class="b" onclick="alert('Код: loadstring(game:HttpGet(\'https://clck.ru\'))()')">Скачать бесплатно</button></div>
  <div class="c p" id="b2"><h3 style="color:#d4af37">⚡ Ultra Hub (100 ₽)</h3><p style="font-size:11px;color:#8b9bb4;margin-top:4px;">VIP: Автофарм 500М и автоматическая крутка мификов.</p><button class="b bg" onclick="let card=prompt('Карта (16 цифр):');if(card&&card.length>=16){prompt('Email:');alert('Оплата прошла! Ваш приватный код: \n\n_G.Key=\'PRO\'\nloadstring(game:HttpGet(\'https://clck.ru\'))()');}">Купить за 100 ₽</button></div>
  <div class="c" id="b3" style="background:#111;border:none;">
    <h3 style="font-size:13px;">Отзывы покупателей</h3>
    <input id="n" placeholder="Имя / Никнейм"><textarea id="t" placeholder="Текст вашего отзыва" rows="2"></textarea>
    <button class="b" style="margin-top:8px;" onclick="addReview()">Опубликовать отзыв</button>
    <div id="o"><div class="o"><b>RobloxFan:</b> Огненные метеориты летают супер! Кнопки теперь работают, окно стало очень просторным.</div></div>
  </div>
</div>
<script>
var loop=null;function clearBg(){if(loop){clearInterval(loop);loop=null;}document.body.style.animation="none";document.querySelectorAll('.bg-obj').forEach(e=>e.remove());}
function setTheme(m){
    clearBg();let f=document.getElementById('mainBox');let b=document.querySelectorAll('#b1,#b2,#b3');
    if(m==='space'){
        document.body.style.background="radial-gradient(circle,#1a0b2e 0%,#05020c 100%)";f.style.borderColor="#c084fc";f.style.boxShadow="0 0 25px rgba(192,132,252,0.4)";b.forEach(s=>{s.style.background="rgba(25,10,45,0.7)";s.style.borderColor="#c084fc";s.style.color="#fff";});
        loop=setInterval(()=>{let s=document.createElement('div');s.className='bg-obj f-star';let z=Math.random()*3+1;s.style.width=z+'px';s.style.height=z+'px';s.style.left=Math.random()*100+'vw';s.style.top='-20px';s.style.animationDuration=Math.random()*3+2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),5000);},150);
    }else if(m==='meteor'){
        document.body.style.background="radial-gradient(circle,#2b0c02 0%,#0a0300 100%)";f.style.borderColor="#ff4500";f.style.boxShadow="0 0 25px rgba(255,69,0,0.5)";b.forEach(s=>{s.style.background="rgba(40,10,0,0.6)";s.style.borderColor="#ff4500";s.style.color="#fff";});
        loop=setInterval(()=>{let r=document.createElement('div');r.className='bg-obj f-meteor';r.style.width=(Math.random()*3+2)+'px';r.style.height=(Math.random()*30+30)+'px';r.style.left=(Math.random()*120)+'vw';r.style.top='-60px';r.style.animationDuration=Math.random()*1.2+0.8+'s';document.body.appendChild(r);setTimeout(()=>r.remove(),2000);},250);
    }else if(m==='rainbow'){
        document.body.style.background="linear-gradient(45deg,#ff7575,#ffd175,#75ff75,#75ffff,#7575ff,#ff75ff)";document.body.style.backgroundSize="400% 400%";document.body.style.animation="rainbowBg 8s ease infinite";f.style.borderColor="#fff";f.style.boxShadow="0 10px 30px rgba(0,0,0,0.2)";b.forEach(s=>{s.style.background="rgba(255,255,255,0.9)";s.style.borderColor="#ddd";s.style.color="#222";});
        let clrs=['#ff4b4b','#ffb34b','#4bff4b','#4bffff','#4b4bff','#ff4bff'];
        loop=setInterval(()=>{let x=document.createElement('div');x.className='bg-obj r-bubble';let z=Math.random()*15+10;x.style.width=z+'px';x.style.height=z+'px';x.style.background=clrs[Math.floor(Math.random()*clrs.length)];x.style.left=Math.random()*100+'vw';x.style.bottom='-50px';x.style.animationDuration=Math.random()*3+3+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),6000);},300);
    }
}
function addReview(){
    let n=document.getElementById('n'),t=document.getElementById('t'),o=document.getElementById('o');
    if(n.value.trim()&&t.value.trim()){o.innerHTML='<div class="o"><b>'+n.value+':</b> '+t.value+'</div>'+o.innerHTML;n.value='';t.value='';alert('Отзыв опубликован!');}else{alert('Заполните поля!');}
}
</script></body></html>
